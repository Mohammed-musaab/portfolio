:root{--bg:#7fb4f5;--ink:#04215a;--red:#05297a;--red-bright:#0a4fd6;--mute:#0f2f6b;--line:rgba(4,33,90,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(#3f86f0,#cfe6ff) fixed;color:var(--ink);text-shadow:0 0 22px rgba(255,255,255,.5);font-family:"DM Sans",system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:2px solid var(--red-bright);outline-offset:3px}
nav{background:linear-gradient(rgba(220,236,255,.6),transparent)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#track{height:800vh;width:1px;pointer-events:none}
.bar{position:fixed;top:0;left:0;width:0;height:4px;background:var(--red);box-shadow:0 0 18px rgba(10,60,200,.8);z-index:100}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 4vw}
.logo,h1,h2,.blk h3,.st b,.q p,.cta{font-family:"Big Shoulders Display",Impact,sans-serif}
.logo{font-size:25px;font-weight:900;letter-spacing:.04em}
.logo i{font-style:normal;opacity: 0.9;}
.nl{display:flex;gap:28px}
.nl a{color:var(--mute);text-decoration:none;font-size:15px;transition:.25s}
.nl a:hover{color:var(--ink)}
.pill{text-decoration:none;color:#fff;background:var(--red);padding:9px 20px;border-radius:100px;transition:.25s}
.pill:hover{background:var(--red-bright);transform:translateY(-2px);box-shadow:0 0 30px rgba(10,60,200,.4)}
.p{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:0 6vw;opacity:0;pointer-events:none;will-change:opacity,transform}
.p.on{pointer-events:auto}
.r{text-align:right;align-items:flex-end}
.ctr{text-align:center;align-items:center}
h1,h2{font-weight:900;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:clamp(60px,12.5vw,190px)}
h2{font-size:clamp(48px,8.2vw,130px)}
.p>p{max-width:48ch;margin-top:24px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,65px);margin-top:35px}
.st b{display:block;color:var(--red);font-size:clamp(50px,6.4vw,95px);font-weight:900;line-height:1}
.st span{color:var(--mute);font-size:14px}
.prog{--w:220px;--h:80px;display:flex;flex-wrap:wrap;gap:90px 50px;margin:80px 0 40px 20px;padding:0;list-style:none}
.prog li{list-style:none}
.prog li:nth-child(1){--c:#0a4fd6;--c1:#0942b4;--c2:#2a69e6}
.prog li:nth-child(2){--c:#0e5fb8;--c1:#0b4f9c;--c2:#2878cc}
.prog li:nth-child(3){--c:#3b3fc4;--c1:#3235a8;--c2:#5256d6}
.prog li:nth-child(4){--c:#0a7db8;--c1:#086a9c;--c2:#2a95cc}
.prog a{position:relative;display:flex;align-items:center;gap:14px;width:var(--w);height:var(--h);padding-left:20px;background:#fff;color:var(--ink);text-decoration:none;text-shadow:none;transform:rotate(-30deg) skew(25deg) translate(0,0);transition:.5s;box-shadow:-20px 20px 10px rgba(4,33,90,.35)}
.prog a:before,.prog a:after{content:"";position:absolute;background:#9db5d6;transition:.5s}
.prog a:before{top:10px;left:-20px;height:100%;width:20px;transform:rotate(0deg) skewY(-45deg)}
.prog a:after{bottom:-20px;left:-10px;height:20px;width:100%;transform:rotate(0deg) skewX(-45deg)}
.prog a:hover,.prog a:focus-visible{background:var(--c);transform:rotate(-30deg) skew(25deg) translate(20px,-15px);box-shadow:-50px 50px 50px rgba(4,33,90,.35)}
.prog a:hover:before,.prog a:focus-visible:before{background:var(--c1)}
.prog a:hover:after,.prog a:focus-visible:after{background:var(--c2)}
.prog .ic{flex:none;width:36px;height:36px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.5s}
.prog span{font:500 14px "DM Sans",system-ui,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--ink);transition:.5s}
.prog a:hover .ic,.prog a:focus-visible .ic{stroke:#fff}
.prog a:hover span,.prog a:focus-visible span{color:#fff}
.shot{display:block;width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:18px;border:1px solid var(--line)}
.qs{display:grid;max-width:650px;margin-top:28px}
.q{padding:20px 0;border-top:1px solid var(--line)}
.q p{font-size:clamp(25px,3vw,38px);font-weight:700;line-height:1.05;text-transform:uppercase}
.q span{display:block;margin-top:8px;color:var(--mute);font-size:14px}
.cta{display:inline-block;margin-top:30px;padding:17px 42px;border-radius:100px;background:var(--red);color:#fff;text-decoration:none;font-size:22px;font-weight:700;text-transform:uppercase;transition:.25s}
.cta:hover{background:var(--red-bright);transform:scale(1.06);box-shadow:0 0 60px rgba(10,60,200,.5)}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.cta.ghost:hover{background:var(--red);border-color:var(--red);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:35px}
.acts .cta{margin-top:0}
.ctr .acts{justify-content:center}
.hint{position:fixed;left:50%;bottom:calc(25px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;color:var(--mute);font-size:14px;transition:opacity .4s}
.gb{position:fixed;left:4vw;bottom:calc(25px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:100px;padding:12px 24px;background:var(--red);color:#fff;font:500 15px "DM Sans",system-ui,sans-serif;cursor:pointer;opacity:0;visibility:hidden;transition:.25s}
.gb.show{opacity:1;visibility:visible}
.gb:hover{background:var(--red-bright);transform:scale(1.05)}
.pbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px 6vw;background:linear-gradient(rgba(220,236,255,.92),transparent);opacity:0;visibility:hidden;transition:.3s}
.pbar.open{opacity:1;visibility:visible}
.pbar div{display:flex;gap:22px;flex-wrap:wrap}
.pbar a,.pbar button{color:var(--mute);text-decoration:none;background:none;border:0;cursor:pointer;font:15px "DM Sans",system-ui,sans-serif}
.pbar a:hover,.pbar button:hover{color:var(--ink)}
.pbar .bk{color:var(--ink);border:1px solid var(--ink);border-radius:100px;padding:8px 18px}
.pg{position:fixed;inset:0;z-index:40;overflow-y:auto;padding:110px 6vw 70px;background:rgba(226,240,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);opacity:0;visibility:hidden;transition:.4s}
.pg.open{opacity:1;visibility:visible}
.lead{max-width:58ch;margin:24px 0 45px;color:var(--mute);font-size:19px}
.blk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px 5vw;padding:30px 0;border-top:1px solid var(--line)}
.blk h3{font-size:clamp(34px,4.4vw,64px);font-weight:900;line-height:.95;text-transform:uppercase}
.blk h3 small{display:block;margin-top:10px;color:var(--mute);font:400 14px "DM Sans",system-ui,sans-serif;text-transform:none}
.blk h3 small:empty{display:none}
.blk p{max-width:54ch;color:var(--mute)}
.blk a{color:var(--red-bright)}
.blk ul{display:grid;gap:9px;margin-top:15px;list-style:none}
.blk li{padding-left:14px;border-left:2px solid var(--red);color:var(--mute)}
@media(max-width:700px){nav{padding:18px 5vw}.nl{display:none}.logo{font-size:20px}.p{padding:0 7vw}.r{text-align:left;align-items:flex-start}.prog{--w:150px;--h:60px;gap:70px 30px;margin:60px 0 20px 18px}.prog span{font-size:11px;letter-spacing:1.5px}.prog .ic{width:26px;height:26px}.prog a{padding-left:14px;gap:10px}.blk{grid-template-columns:1fr}.pbar{padding:18px 5vw}.pbar div{gap:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.01ms!important}}


</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="track"></div>
<div class="bar" id="bar"></div>
<nav>
<div class="logo">MOHAMMED <i>MUSAIB</i></div>
<div class="nl"><a href="#/work">Work</a><a href="#/experience">Experience</a><a href="#/skills">Skills</a><a href="#/contact">Contact</a></div>
<a class="pill" href="#/contact">Get in touch</a>
</nav>
<div id="ui"></div>
<div class="pbar" id="pbar">
<button class="bk" id="back">Go back</button>
<div><a href="#/work">Work</a><a href="#/experience">Experience</a><a href="#/skills">Skills</a><a href="#/contact">Contact</a></div>
</div>
<div id="pages"></div>
<button class="gb" id="gb">Back to top</button>
<div class="hint" id="hint">Scroll to begin</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* EDIT THIS OBJECT: all page content lives here */
const D={
name:"Mohammed Musaib",
role:"CSE Student",
tagline:"I am a quick learner and it helps me adapt quickly to new challenges.",
about:"Inspired from the current technology trends, It inspires me to become specialised in Cloud Computing and Security.",
cta:"I am open to new roles, collaborations and conversations.",
linkedin:"https://www.linkedin.com/in/mohammed-musab/",
email:"mohammedmusaib532005@gmail.com",
github:"https://github.com/mohammed-musaib",
stats:[["0+","Years of experience"],["2","Projects"]],
work:[
{t:"AML system",tags:["Anti Money Laundering Transaction System"],d:"Due to increased frauds in transaction history, By the acquired skills i have implemented a system that can be helpful to detect suspicious transactions by uploading the dataset, Implemented using Random Forest algorithm.",link:""},
{t:"Password guessing application",tags:["Application that guesses passwords using Brute Force algorithm"],d:"passwords could be forgotten by humans, To prevent Human worries we have come up with a solution that guesses passwords using Brute Force algorithm and Hashing.",link:""},
{t:"Diabetes Prediction System",tags:["Machine Learning","Healthcare"],d:"Developed a machine learning model to predict diabetes risk based on patient data by using the .",link:""}],
exp:[
{co:"Company Name",role:"Job Title",when:"2023 to Present",pts:["Name a piece of work you led and its outcome in numbers.","Add a second achievement from this role."]},
{co:"Previous Company",role:"Job Title",when:"2020 to 2023",pts:["Add an achievement from this role.","Add another achievement from this role."]}],
skills:{"Core skills":["Python, C, Java","HTML, CSS & JS","Skill three"],"Tools":["Tool one","Tool two","Tool three"],"Strengths":["Strength one","Strength two"]}
};

const [f,...l]=D.name.split(" ");
const ic={
work:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
experience:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
skills:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
contact:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
};
const nav=[["work","Work","Projects and results."],["experience","Experience","Roles and impact."],["skills","Skills","Tools and strengths."],["contact","Contact","Start a conversation."]];
const li=a=>"<ul>"+a.map(x=>`<li>${e(x)}</li>`).join("")+"</ul>";
const blk=(h,s,b)=>`<div class="blk"><h3>${e(h)}<small>${e(s)}</small></h3><div>${b}</div></div>`;
const ext=h=>h.startsWith("mailto")?"":' target="_blank" rel="noopener"';
const btn=(h,t,g)=>`<a class="cta${g?" ghost":""}" href="${e(h)}"${ext(h)}>${t}</a>`;
const pg=(id,t,lead,b,a)=>`<article class="pg" id="pg-${id}"><h2 tabindex="-1">${t}</h2><p class="lead">${e(lead)}</p>${b}<div class="acts">${a}</div></article>`;
const links=[["LinkedIn",D.linkedin],["Email",D.email&&"mailto:"+D.email],["GitHub",D.github]].filter(x=>x[1]);
const ctas=links.map((x,i)=>btn(x[1],x[0],i)).join("");

$("ui").innerHTML=`
<section class="p" id="s0"><h1>${e(f)}<br>${e(l.join(" "))}.</h1><p>${e(D.role)}. ${e(D.tagline)}</p></section>
<section class="p r" id="s1"><h2>Hello,<br>I'm ${e(f)}.</h2><p>${e(D.about)}</p></section>
<section class="p" id="s2"><h2>Explore<br>About me.</h2><ul class="prog">${nav.map(n=>`<li><a href="#/${n[0]}">${ic[n[0]]}<span>${n[1]}</span></a></li>`).join("")}</ul></section>
<section class="p r" id="s3"><h2>By the<br>numbers.</h2><div class="row">${D.stats.map(s=>`<div class="st"><b>${e(s[0])}</b><span>${e(s[1])}</span></div>`).join("")}</div></section>
<section class="p" id="s4"><h2>Selected<br>work.</h2><div class="qs">${D.work.slice(0,3).map(w=>`<div class="q"><p>${e(w.t)}</p><span>${e(w.tags.join(", "))}</span></div>`).join("")}</div></section>
<section class="p ctr" id="s5"><h2>Let's<br>talk.</h2><p>${e(D.cta)}</p><div class="acts">${ctas}</div></section>`;

$("pages").innerHTML=
pg("work","Work","Selected projects and the results they delivered.",D.work.map(w=>blk(w.t,w.tags.join(", "),(w.img?`<img class="shot" src="${e(w.img)}" alt="${e(w.t)}">`:"")+`<p>${e(w.d)}</p>`+(w.link?`<p><a href="${e(w.link)}" target="_blank" rel="noopener">View project</a></p>`:""))).join(""),btn(D.linkedin,"Discuss a project"))+
pg("experience","Experience","Where I have worked and what I delivered.",D.exp.map(x=>blk(x.co,x.role+", "+x.when,li(x.pts))).join(""),btn(D.linkedin,"Full history on LinkedIn"))+
pg("skills","Skills","The tools and strengths I rely on.",Object.entries(D.skills).map(k=>blk(k[0],"",li(k[1]))).join(""),"")+
pg("contact","Contact","The fastest way to reach me.",blk("Find me","Open to conversations",`<p>${links.map(x=>`<a href="${e(x[1])}"${ext(x[1])}>${x[0]}</a>`).join("<br>")}</p>`),ctas);

/* ROUTING */
const names=nav.map(n=>n[0]);
function route(){
const m=location.hash.match(/^#\/(\w+)/),k=m&&names.includes(m[1])?m[1]:null;
names.forEach(n=>$("pg-"+n).classList.toggle("open",n===k));
$("pbar").classList.toggle("open",!!k);
document.body.style.overflow=k?"hidden":"";
if(k){const a=$("pg-"+k);a.scrollTop=0;a.querySelector("h2").focus({preventScroll:true})}
}
const home=()=>{try{history.pushState("",document.title,location.pathname+location.search)}catch(_){location.hash=""}route()};
addEventListener("hashchange",route);route();
$("back").onclick=home;
$("gb").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("keydown",ev=>{if(ev.key==="Escape"&&location.hash)home()});

/* LIVE CLOUD BACKGROUND: WebGL shader, rendered at up to 1920x1080 */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R,M;uniform float T,P;
const vec3 HZ=vec3(.80,.91,1.);
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fb(vec2 p,int o){float a=.5,s=0.;for(int i=0;i<6;i++){if(i>=o)break;s+=a*n(p);p=mat2(1.6,1.2,-1.2,1.6)*p;a*=.5;}return s;}
vec3 L(vec3 c,vec2 uv,float i,vec2 sun){
vec2 p=(uv+M*(.06-.02*i))*(1.7+i*1.3)/(1.+P*(1.2-i*.4))+vec2(T*.03*(3.-i),P*(4.-i*1.3));
p+=fb(p*.6+T*.01,3)*.9;
float d=fb(p,6);
float cov=.55-.06*sin(P*3.1416)+i*.02;
float a=smoothstep(cov,cov+.14,d);
float d2=fb(p+normalize(sun-uv)*.07,4);
float lit=clamp((d-d2)*7.+.58,0.,1.);
vec3 sh=mix(vec3(.50,.66,.88),vec3(1.),lit);
sh+=a*(1.-a)*.35*lit;
sh=mix(sh,HZ,i*.18);
return mix(c,sh,a*(.97-i*.14));
}
void main(){
vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
vec2 sun=vec2(.45,.32);
float g=uv.y+.5;
vec3 c=mix(HZ,vec3(.36,.64,.98),smoothstep(0.,.55,g));
c=mix(c,mix(vec3(.20,.48,.93),vec3(.36,.64,.98),P*.5),smoothstep(.45,1.,g));
c+=vec3(1.,.97,.9)*pow(max(0.,1.-length(uv-sun)*1.3),3.)*.45;
c=L(c,uv,2.,sun);c=L(c,uv,1.,sun);c=L(c,uv,0.,sun);
c=mix(c,vec3(.93,.97,1.),(1.-smoothstep(0.,.25,g))*.5);
c+=(h(gl_FragCoord.xy+fract(T))-.5)/128.;
gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;
const cv=$("gl");
let g=null,ok=false,uR,uM,uT,uP;
try{
g=cv.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
const mk=(t,src)=>{const x=g.createShader(t);g.shaderSource(x,src);g.compileShader(x);return x};
const pr=g.createProgram();
g.attachShader(pr,mk(g.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
g.attachShader(pr,mk(g.FRAGMENT_SHADER,FS));
g.linkProgram(pr);
ok=g.getProgramParameter(pr,g.LINK_STATUS);
if(ok){
g.useProgram(pr);
g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer());
g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
const a=g.getAttribLocation(pr,"a");
g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);
[uR,uM,uT,uP]=["R","M","T","P"].map(k=>g.getUniformLocation(pr,k));
}
}catch(_){ok=false}
if(!ok)cv.style.display="none";
const rs=()=>{const d=Math.min(devicePixelRatio||1,2),W=innerWidth*d,H=innerHeight*d,k=Math.min(1,(innerWidth<700?1280:1920)/Math.max(W,H));cv.width=W*k|0;cv.height=H*k|0;if(ok)g.viewport(0,0,cv.width,cv.height)};
addEventListener("resize",rs);rs();

/* SCROLL + POINTER */
let tS=0,cS=0,mx=0,my=0,tx=0,ty=0;
const upd=()=>{const m=document.documentElement.scrollHeight-innerHeight;tS=m>0?Math.max(0,Math.min(1,scrollY/m)):0};
addEventListener("scroll",upd,{passive:true});upd();
addEventListener("pointermove",ev=>{tx=ev.clientX/innerWidth-.5;ty=.5-ev.clientY/innerHeight});
const pn=[0,1,2,3,4,5].map(i=>$("s"+i)),C=[0,.2,.4,.6,.8,1],t0=performance.now();

/* LOOP */
(function loop(){
requestAnimationFrame(loop);
cS=reduce?tS:cS+(tS-cS)*.075;
const p=cS,t=reduce?0:(performance.now()-t0)/1000;
mx+=(tx-mx)*.05;my+=(ty-my)*.05;
if(ok&&document.body.style.overflow!=="hidden"){g.uniform2f(uR,cv.width,cv.height);g.uniform2f(uM,mx,my);g.uniform1f(uT,t);g.uniform1f(uP,p);g.drawArrays(g.TRIANGLES,0,3)}
pn.forEach((el,i)=>{
const w=i===0||i===5?.09:.105;
let o=Math.max(0,Math.min(1,1-Math.abs(p-C[i])/w));
o=o*o*(3-2*o);
const d=p<C[i]?1:-1;
el.style.opacity=o;
el.style.transform=`translate3d(0,${d*(1-o)*50}px,0) scale(${1-(1-o)*.04})`;
el.classList.toggle("on",o>.5);
});
$("bar").style.width=p*100+"%";
$("hint").style.opacity=p<.03?"1":"0";
$("gb").classList.toggle("show",p>.03&&!location.hash);
})();
})();
</script>
</body>
</html>
